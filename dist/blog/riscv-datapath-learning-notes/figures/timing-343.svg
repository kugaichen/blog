<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="多路径的最早变化与最晚稳定（图 3.43）"><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#17324d"><text x="25" y="38" font-size="26">多路径的最早变化与最晚稳定（图 3.43）</text><text x="25" y="96">a) X′、Y′</text><path d="M190 104 H820" stroke="#9aabba"/><rect x="330" y="84" width="370" height="22" rx="3" fill="#afcef1"/><path d="M330 80v30 M700 80v30" stroke="#235489"/><text x="515" y="76" text-anchor="middle" font-size="17">可能变化区间（示意）</text><text x="25" y="160">b) 最长路径</text><path d="M190 168 H820" stroke="#9aabba"/><rect x="190" y="148" width="510" height="22" rx="3" fill="#afcef1"/><path d="M190 144v30 M700 144v30" stroke="#235489"/><text x="445" y="140" text-anchor="middle" font-size="17">CLK → A → n₁ → X′ → Y′</text><text x="25" y="224">Y′ 建立窗口</text><path d="M190 232 H820" stroke="#9aabba"/><rect x="700" y="212" width="120" height="22" rx="3" fill="#afcef1"/><path d="M700 208v30 M820 208v30" stroke="#235489"/><text x="760" y="204" text-anchor="middle" font-size="17">到下一沿</text><text x="25" y="288">c) 最短路径</text><path d="M190 296 H820" stroke="#9aabba"/><rect x="190" y="276" width="385" height="22" rx="3" fill="#afcef1"/><path d="M190 272v30 M575 272v30" stroke="#235489"/><text x="382.5" y="268" text-anchor="middle" font-size="17">CLK → C（30 ps）→ X′（55 ps）</text><text x="25" y="352">X′ 保持窗口</text><path d="M190 360 H820" stroke="#9aabba"/><rect x="190" y="340" width="420" height="22" rx="3" fill="#afcef1"/><path d="M190 336v30 M610 336v30" stroke="#235489"/><text x="400" y="332" text-anchor="middle" font-size="17">沿后 0–60 ps：提前 5 ps 变化</text></g></svg>
